# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
name: CI
on:
  push:
    branches: master
  pull_request:
    branches: master
jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_MAINNET_URL: ${{ secrets.BASE_MAINNET_URL }}
      FRAXTAL_MAINNET_URL: ${{ secrets.FRAXTAL_MAINNET_URL }}
      ARBITRUM_MAINNET_URL: ${{ secrets.ARBITRUM_MAINNET_URL }}
      TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
      FOUNDRY_PROFILE: "test"
    steps:
      - uses: actions/setup-node@v2
        with:
          node-version: 16.x
      - uses: actions/checkout@v2
      - uses: pnpm/action-setup@v2
        with:
          version: 8.11.0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: pnpm i
      - run: pnpm lint:check
      - run: forge build
      - run: >-
          forge test --no-match-path
          'src/test/{SimulateEthereumDefaultAdminRole.t.sol,hop/RemoteHopV2TempoForkTest.t.sol,hop/RemoteHopV2TempoRealOFTIntegration.t.sol,hop/RemoteHopV201TempoRealOFTIntegration.t.sol,hop/TempoFeeInclusiveWrapperForkTest.t.sol,hop/ThreeChainHopTest.t.sol,vault/RemoteVaultDepositTest.t.sol}'
      - run: >-
          FOUNDRY_PROFILE=testbuild forge test --match-path
          'src/test/vault/RemoteVaultDepositTest.t.sol'
      # Tempo mainnet-fork tests need the Tempo precompiles compiled into forge's EVM,
      # which are only enabled under `--network tempo`. Kept out of the default step so
      # the flag does not change EVM semantics for every other test.
      - run: >-
          forge test --network tempo --match-path
          'src/test/hop/TempoFeeInclusiveWrapperForkTest.t.sol'
      # Production Tempo hops (V2 and the deployed V201) against the real Tempo OFTs and the local TIP20 /
      # StablecoinDEX / FeeManager precompiles, no RPC needed. Carries the fee-swap headroom regression
      # (DEX quote-vs-fill divergence), so it must run on every change to TempoGasTokenBase.
      - run: >-
          forge test --network tempo --match-path
          'src/test/hop/RemoteHopV2*TempoRealOFTIntegration.t.sol'
